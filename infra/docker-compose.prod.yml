# klopilot.ch — Produktions-Compose
# Voraussetzungen: .env.prod vorhanden, Traefik-Netzwerk existiert
# Start: docker compose -f docker-compose.prod.yml up -d

services:
  # ── PostgreSQL 16 + PostGIS 3.4 ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: klopilot-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klopilot}
      POSTGRES_USER: ${POSTGRES_USER:-klopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-klopilot} -d ${POSTGRES_DB:-klopilot}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [klopilot]

  # ── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: klopilot-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [klopilot]

  # ── MinIO (S3-kompatibler Object Storage) ────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: klopilot-minio
    restart: always
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      MINIO_BROWSER_REDIRECT_URL: https://minio.klopilot.ch
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    labels:
      - 'traefik.enable=true'
      # MinIO API
      - 'traefik.http.routers.minio.rule=Host(`minio-api.klopilot.ch`)'
      - 'traefik.http.routers.minio.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.minio.service=minio'
      - 'traefik.http.services.minio.loadbalancer.server.port=9000'
      # MinIO Console
      - 'traefik.http.routers.minio-console.rule=Host(`minio.klopilot.ch`)'
      - 'traefik.http.routers.minio-console.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.minio-console.service=minio-console'
      - 'traefik.http.services.minio-console.loadbalancer.server.port=9001'
    networks: [klopilot, traefik]

  # ── MinIO Init — erstellt Bucket einmalig beim Start ─────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: klopilot-minio-init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
        mc mb --ignore-existing local/${S3_BUCKET:-klopilot-media} &&
        mc anonymous set download local/${S3_BUCKET:-klopilot-media} &&
        echo 'MinIO bucket ready.'
      "
    networks: [klopilot]

  # ── Meilisearch ──────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: klopilot-meili
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:?MEILI_KEY must be set}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:7700/health | grep -q "available"']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [klopilot]

  # ── API (NestJS) ──────────────────────────────────────────────────────────
  api:
    image: ${REGISTRY:-ghcr.io/4cpa}/klopilot-api:${TAG:-latest}
    container_name: klopilot-api
    restart: always
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3101/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`api.klopilot.ch`)'
      - 'traefik.http.routers.api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.api.middlewares=api-ratelimit'
      - 'traefik.http.services.api.loadbalancer.server.port=3101'
      # Rate-Limit: 200 req/min pro IP (zusätzlich zum App-eigenen Throttler)
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.average=200'
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.burst=50'
    networks: [klopilot, traefik]

  # ── Web (Next.js) ─────────────────────────────────────────────────────────
  web:
    image: ${REGISTRY:-ghcr.io/4cpa}/klopilot-web:${TAG:-latest}
    container_name: klopilot-web
    restart: always
    env_file: .env.prod
    depends_on:
      api:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.web.rule=Host(`klopilot.ch`) || Host(`www.klopilot.ch`)'
      - 'traefik.http.routers.web.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.web.middlewares=www-redirect'
      - 'traefik.http.services.web.loadbalancer.server.port=3102'
      # www → apex redirect
      - 'traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.+)'
      - 'traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}'
      - 'traefik.http.middlewares.www-redirect.redirectregex.permanent=true'
    networks: [klopilot, traefik]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  meili_data:
    driver: local

networks:
  klopilot:
    name: klopilot
  traefik:
    external: true
    name: traefik

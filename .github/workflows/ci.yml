name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write   # Docker images nach GHCR pushen

# Parallele Runs für denselben Branch/PR abbrechen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  # Läuft sofort, kein Service nötig — gibt schnell Feedback bei Stil-Fehlern.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo run lint ruft: api → eslint, web → next lint, mobile → expo lint
      - name: Lint all packages
        run: pnpm lint

  # ── Job 2: Type-check ──────────────────────────────────────────────────────
  # Läuft parallel zu lint — tsc --noEmit für api, web und mobile.
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @klopilot/api exec prisma generate

      - name: Type-check API
        run: pnpm --filter @klopilot/api exec tsc --noEmit

      - name: Type-check Web
        run: pnpm --filter @klopilot/web exec tsc --noEmit

      - name: Type-check Mobile
        run: pnpm --filter @klopilot/mobile exec tsc --noEmit

  # ── Job 3: Test ────────────────────────────────────────────────────────────
  # Unit- und Integrationstests; braucht Postgres + Redis.
  # Startet erst wenn typecheck grün ist (kein Punkt Tests mit Typ-Fehlern).
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: klopilot_test
          POSTGRES_USER: klopilot
          POSTGRES_PASSWORD: klopilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://klopilot:klopilot_test@localhost:5432/klopilot_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NODE_ENV: test
      # Stub-Werte für optionale externe Services (werden in Tests gemockt)
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: klopilot-media
      S3_KEY: minioadmin
      S3_SECRET: minioadmin
      MEILI_HOST: http://localhost:7700
      MEILI_KEY: masterkey
      MAIL_FROM: ci@klopilot.ch
      MAIL_HOST: localhost
      MAIL_PORT: '1025'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @klopilot/api exec prisma generate

      - name: Run Prisma migrations
        run: pnpm --filter @klopilot/api db:deploy

      - name: Unit & Integration tests (API)
        run: pnpm --filter @klopilot/api test

  # ── Job 4: Build ───────────────────────────────────────────────────────────
  # Kompiliert alle Apps. Läuft erst wenn lint + typecheck grün sind.
  # Validiert dass das Deployment-Artefakt gebaut werden kann.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    env:
      # Minimal-Vars damit Next.js keine Fehler wirft
      NEXT_PUBLIC_API_URL: http://localhost:3101
      NEXT_PUBLIC_DEFAULT_LNG: '8.539'
      NEXT_PUBLIC_DEFAULT_LAT: '47.378'
      NEXT_PUBLIC_DEFAULT_ZOOM: '13'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @klopilot/api exec prisma generate

      - name: Build all apps (API + Web)
        run: pnpm build

      # Docker-Images bauen und bei main-Push nach GHCR pushen
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login auf allen Events: nötig, um das private Base-Image aus GHCR
      # (ghcr.io/4cpa/node, s. mirror-base-images.yml) auch auf PRs zu ziehen.
      # Der eigentliche Push der App-Images bleibt über push: unten auf main
      # beschränkt.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          # Nur bei main-Push pushen, sonst nur validieren
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/4cpa/klopilot-api:latest
            ghcr.io/4cpa/klopilot-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/4cpa/klopilot-web:latest
            ghcr.io/4cpa/klopilot-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.klopilot.ch
            NEXT_PUBLIC_S3_PUBLIC_URL=https://minio-api.klopilot.ch/klopilot-media
            NEXT_PUBLIC_DEFAULT_LNG=7.4474
            NEXT_PUBLIC_DEFAULT_LAT=46.9481
            NEXT_PUBLIC_DEFAULT_ZOOM=13
            NEXT_PUBLIC_MAPTILER_KEY=${{ secrets.MAPTILER_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: E2E Web (nur bei Pull Requests) ─────────────────────────────────
  # Playwright (chromium + webkit) gegen die gebaute Next.js-App. Startet API +
  # Postgres/Redis/Meilisearch, damit auch der Such-Test echte Treffer bekommt.
  e2e-web:
    name: E2E Web (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: klopilot_test
          POSTGRES_USER: klopilot
          POSTGRES_PASSWORD: klopilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: masterkey
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://klopilot:klopilot_test@localhost:5432/klopilot_test
      REDIS_URL: redis://localhost:6379
      MEILI_HOST: http://localhost:7700
      MEILI_KEY: masterkey
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      API_PORT: '3101'
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: klopilot-media
      S3_PUBLIC_URL: http://localhost:9000/klopilot-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      MAIL_FROM: ci@klopilot.ch
      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      NEXT_PUBLIC_API_URL: http://localhost:3101
      NEXT_PUBLIC_DEFAULT_LNG: '8.539'
      NEXT_PUBLIC_DEFAULT_LAT: '47.378'
      NEXT_PUBLIC_DEFAULT_ZOOM: '13'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium + webkit)
        run: pnpm --filter @klopilot/web exec playwright install --with-deps chromium webkit

      - name: Generate Prisma Client
        run: pnpm --filter @klopilot/api exec prisma generate

      - name: Run Prisma migrations
        run: pnpm --filter @klopilot/api db:deploy

      - name: Build API + Web
        run: pnpm --filter @klopilot/api build && pnpm --filter @klopilot/web build

      - name: Start API
        run: |
          nohup node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://localhost:3101/health >/dev/null 2>&1 && { echo "API up"; break; }
            sleep 2
          done
          curl -fsS http://localhost:3101/health || { echo "API kam nicht hoch:"; cat /tmp/api.log; exit 1; }

      - name: Seed Meilisearch (E2E-Such-Fixture)
        run: |
          curl -fsS -X POST "http://localhost:7700/indexes/toilets/documents?primaryKey=id" \
            -H "Authorization: Bearer masterkey" -H "Content-Type: application/json" \
            -d '[{"id":"e2e-wc-1","name":"Öffentliches WC Bahnhof","address":"Bahnhofplatz 1, Zürich","category":"public","_geo":{"lat":47.378,"lng":8.539}}]'
          sleep 3

      - name: Run E2E tests
        run: pnpm --filter @klopilot/web test:e2e
        # Playwright startet `next start` automatisch via webServer-Config

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

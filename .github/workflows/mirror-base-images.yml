name: Mirror base images

# Spiegelt die Docker-Hub-Base-Images, auf denen unsere App-Dockerfiles aufsetzen,
# nach GHCR (ghcr.io/4cpa/…). So zieht CI/Release das Base-Image aus derselben
# Registry, in die wir ohnehin pushen — Docker Hub (inkl. der zeitweise mit 504
# antwortenden auth.docker.io) liegt damit nicht mehr im kritischen Build-Pfad.
#
# Läuft entkoppelt vom CI: wöchentlich (holt Patch-Updates des Base-Tags) und
# manuell per workflow_dispatch. Fehlschläge hier blockieren keinen Deploy.

on:
  schedule:
    - cron: '17 4 * * 1' # Montags 04:17 UTC
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: mirror-base-images
  cancel-in-progress: false

jobs:
  mirror:
    name: Spiegele Base-Images nach GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          # Quelle (Docker Hub) → Ziel-Tag (GHCR, ghcr.io/<owner>/<repo>)
          - src: docker.io/library/node:22-alpine
            dst: node:22-alpine
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Copy ${{ matrix.image.src }} → GHCR
        env:
          SRC: ${{ matrix.image.src }}
          DST: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.dst }}
        run: |
          set -eu
          # imagetools kopiert das (Multi-Arch-)Manifest direkt Registry→Registry,
          # ohne vollen Image-Pull. Mit Retry gegen sporadische Docker-Hub-5xx.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create --tag "$DST" "$SRC"; then
              echo "✓ gespiegelt: $SRC → $DST"
              docker buildx imagetools inspect "$DST" | head -n 20
              exit 0
            fi
            echo "⚠ Versuch $attempt/5 fehlgeschlagen — warte 30s …"
            sleep 30
          done
          echo "✗ Spiegeln von $SRC nach 5 Versuchen fehlgeschlagen"
          exit 1

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Parallele Runs für denselben Branch/PR abbrechen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  # Läuft sofort, kein Service nötig — gibt schnell Feedback bei Stil-Fehlern.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo run lint ruft: api → eslint, web → next lint, mobile → expo lint
      - name: Lint all packages
        run: pnpm lint

  # ── Job 2: Type-check ──────────────────────────────────────────────────────
  # Läuft parallel zu lint — tsc --noEmit für api, web und mobile.
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @klopilot/api exec prisma generate

      - name: Type-check API
        run: pnpm --filter @klopilot/api exec tsc --noEmit

      - name: Type-check Web
        run: pnpm --filter @klopilot/web exec tsc --noEmit

      - name: Type-check Mobile
        run: pnpm --filter @klopilot/mobile exec tsc --noEmit

  # ── Job 3: Test ────────────────────────────────────────────────────────────
  # Unit- und Integrationstests; braucht Postgres + Redis.
  # Startet erst wenn typecheck grün ist (kein Punkt Tests mit Typ-Fehlern).
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: klopilot_test
          POSTGRES_USER: klopilot
          POSTGRES_PASSWORD: klopilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://klopilot:klopilot_test@localhost:5432/klopilot_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      NODE_ENV: test
      # Stub-Werte für optionale externe Services (werden in Tests gemockt)
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: klopilot-media
      S3_KEY: minioadmin
      S3_SECRET: minioadmin
      MEILI_HOST: http://localhost:7700
      MEILI_KEY: masterkey
      MAIL_FROM: ci@klopilot.ch
      MAIL_HOST: localhost
      MAIL_PORT: '1025'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @klopilot/api exec prisma generate

      - name: Run Prisma migrations
        run: pnpm --filter @klopilot/api db:deploy

      - name: Unit & Integration tests (API)
        run: pnpm --filter @klopilot/api test

  # ── Job 4: Build ───────────────────────────────────────────────────────────
  # Kompiliert alle Apps. Läuft erst wenn lint + typecheck grün sind.
  # Validiert dass das Deployment-Artefakt gebaut werden kann.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    env:
      # Minimal-Vars damit Next.js keine Fehler wirft
      NEXT_PUBLIC_API_URL: http://localhost:3101
      NEXT_PUBLIC_DEFAULT_LNG: '8.539'
      NEXT_PUBLIC_DEFAULT_LAT: '47.378'
      NEXT_PUBLIC_DEFAULT_ZOOM: '13'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @klopilot/api exec prisma generate

      - name: Build all apps (API + Web)
        run: pnpm build

      # Docker-Images bauen (kein Push) — validiert Dockerfile-Korrektheit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build API (validate only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build Web (validate only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3101
            NEXT_PUBLIC_DEFAULT_LNG=8.539
            NEXT_PUBLIC_DEFAULT_LAT=47.378
            NEXT_PUBLIC_DEFAULT_ZOOM=13
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: E2E Web (nur bei Pull Requests) ─────────────────────────────────
  # Playwright gegen gebaute Next.js-App; API nicht gestartet (Smoke-Tests).
  e2e-web:
    name: E2E Web (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3101
      NEXT_PUBLIC_DEFAULT_LNG: '8.539'
      NEXT_PUBLIC_DEFAULT_LAT: '47.378'
      NEXT_PUBLIC_DEFAULT_ZOOM: '13'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @klopilot/web exec playwright install --with-deps chromium

      - name: Build Web
        run: pnpm --filter @klopilot/web build

      - name: Run E2E tests
        run: pnpm --filter @klopilot/web test:e2e
        # Playwright startet next start automatisch via webServer-Config

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
